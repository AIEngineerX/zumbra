[package]
name = "zumbra"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "zumbra"
path = "src/main.rs"

[dependencies]
zumbra-engine = { path = "../engine" }
ows-lib = { path = "../../../ows-core/ows/crates/ows-lib" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
dirs = "6"
ctrlc = "3"
anyhow = "1"
zcash_protocol = { workspace = true }
zeroize = "1"
toml = "0.8"
sha2 = "0.10.9"
hmac = "0.12"
reqwest = "0.13.2"
hex = "0.4.3"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
