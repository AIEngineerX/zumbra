name: Wallet Regression Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "rust/**"
      - "npm/**"
      - "scripts/verify-wallet-stack.py"
      - ".github/workflows/testnet-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "npm/**"
      - "scripts/verify-wallet-stack.py"
      - ".github/workflows/testnet-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ZUMBRA_DATA_DIR: /tmp/zumbra-testnet
  ZUMBRA_TESTNET: "1"

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: testnet-ci-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Verify one wallet crypto family
        run: |
          mkdir -p target
          cargo metadata --locked --format-version 1 > target/wallet-stack.json
          python3 ../scripts/verify-wallet-stack.py target/wallet-stack.json

      - name: Test npm artifact verification
        run: node --test ../npm/test/*.test.js

      - name: Run unit tests
        run: cargo test --locked --workspace

      - name: Build CLI (release)
        run: cargo build --locked --release -p zumbra

      - name: Smoke test - CLI help
        run: ./target/release/zumbra --help

      - name: Smoke test - version
        run: ./target/release/zumbra --version

      - name: Build MCP server
        run: cargo build --locked --release -p zumbra-mcp

      - name: Smoke test - MCP version and help
        run: |
          ./target/release/zumbra-mcp --version
          ./target/release/zumbra-mcp --help

      - name: Clippy
        run: cargo clippy --locked -p zumbra -p zumbra-mcp -p zumbra-engine
