  <g fill="#0B0D12">
    <circle cx="236" cy="276" r="176"/>
    <polygon points="118,168 100,52 214,104"/>
    <polygon points="354,168 372,52 258,104"/>
  </g>
  <g fill="#F2C14E">
    <ellipse cx="184" cy="266" rx="11" ry="34" transform="rotate(-8 184 266)"/>
    <ellipse cx="288" cy="266" rx="11" ry="34" transform="rotate(8 288 266)"/>
  </g>
</svg>
